/* 图片进入效果 */
.fade-up{
    animation: fadeUp 1.2s ease;
}


@keyframes fadeUp{

from{
    opacity:0;
    transform:translateY(30px);
}

to{
    opacity:1;
    transform:none;
}

}


/* 图片 hover */

.photo:hover img{

transform:scale(1.05);

}


.photo img{

transition:0.6s;

}

</style>
